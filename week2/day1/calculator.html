<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <input type="text" class="display" placeholder="0" disabled>

    <div class="buttons">
      <button class="button">C</button>
      <button class="button">/</button>
      <button class="button">*</button>
       <button class="button">←</button>
      <button class="button">7</button>
      <button class="button">8</button>
          <button class="button">9</button>
      <button class="button">-</button>
      <button class="button" >4</button>
      <button class="button">5</button>
        <button class="button">6</button>
       <button class="button">+</button>
      <button class="button">1</button>
      <button class="button">2</button>
      <button class="button">3</button>
      <button class="button equal">=</button>
      <button class="button zero">0</button>
      <button class="button">.</button>
    </div>
  </div>
  <script>

const display = document.querySelector(".display");
const buttons = document.querySelectorAll(".button");

let firstNumber = null;
let operator = null;
let shouldReset = false;

function add(a,b){  return a+b; }
function subtract(a,b){ return a-b; }
function multiply(a,b){ return a*b; }
function divide(a,b){ return b===0 ? display.value = "Error" : a/b; }

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    const button = btn.textContent;

    switch(button){
      case "C":
        display.value = "";
        firstNumber = null;
        operator = null;
        break;

      case "+":
      case "-":
      case "*":
      case "/":
        if(display.value === "") return;
        firstNumber = Number(display.value);
        operator = button;
        shouldReset = true;
        break;

      case "=":
        if(operator===null || display.value==="") return;
        const secondNumber = Number(display.value);
        let result;

        switch(operator){
          case "+": result = add(firstNumber,secondNumber); break;
          case "-": result = subtract(firstNumber,secondNumber); break;
          case "*": result = multiply(firstNumber,secondNumber); break;
          case "/": 
            result = divide(firstNumber,secondNumber);
            if(result===null) return;
            break;
        }

        display.value = result;
        operator = null;
        break;

      case "←":
        display.value = display.value.slice(0,-1);
        break;

      default: 
        if(button === "." && display.value.includes(".")) return; 
        if(shouldReset){
          display.value = button;
          shouldReset = false;
        } else {
          display.value += button;
        }
        break;
    }
  });
});  
  </script>
</body>
</html>
