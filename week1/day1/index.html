    <style>
       *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
         /* border: 2px solid black; */
       } 
       body {
        
         height: 100vh;
         width: 100vw;
         /* background-image: url("men.jpg"); */

       .container{
           /* grid-row-start: ; */

           background-color: rgb(177, 118, 118);
            background-image: url("men.jpg");
            background-repeat: no-repeat;
           background-size: cover;
           height: 100%;
           width: 100%;
           display: grid;
         padding: 2rem;
         row-gap: 1rem;
         column-gap: 1rem;
     /*  grid-template-rows:  100px 100px;
         grid-template-columns: 100px 100px 100px ; */
     /*  grid-template-rows:  1fr 1fr;
         grid-template-columns: 1fr 1fr 1fr; */
      
       }
      
        .container{
                grid-template-rows:  repeat(3,1fr);
         grid-template-columns:  repeat(3,1fr);

        }
          .header{
       
        grid-column-start:1;
        grid-column-end:2;
       }
       /* .footer{
    
        grid-column-start:1;
        grid-column-end:4;
       } */
       .sidebar{
         
        grid-column-start:3;

        .content1{

         display: flex;
         flex-direction: column;
         justify-content:center;
         align-items:center;
        grid-column-start:1;
        grid-column-end:3;
       }
       
       .item{
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid red;
       
        border: 2px solid rgb(0, 0, 0);

              grid-column-start:3;

        }
        #button2{

            color: rgb(109, 78, 30);
            height: 4rem;
            width: 11rem;

        }
        /* menu{

        } */
        .navbar{

          align-items: start;
        }
        a{ 
            font: bold;
            font-size: 1rem;
            color: rgb(57, 50, 38);
            text-decoration: none;
        }
