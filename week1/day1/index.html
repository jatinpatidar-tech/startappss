<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>learn css grid</title>
    <link rel="stylesheet" href="navbar.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* border: 2px solid black; */
      }
      body {
        height: 100vh;
        width: 100vw;
        /* background-image: url("men.jpg"); */
        /* border: 2px solid rgb(4, 4, 4); */
      }
      .container {
        /* grid-row-start: ; */
        /* border: 2px solid rgb(255, 255, 255); */
        background-color: rgb(177, 118, 118);
        background-image: url("main-img.webp");
        background-repeat: no-repeat;
        background-size: cover;
        height: 100%;
        width: 100%;
        display: grid;
        padding: 2rem;
        row-gap: 1rem;
        column-gap: 1rem;
        /*  grid-template-rows:  100px 100px;
         grid-template-columns: 100px 100px 100px ; */
        /*  grid-template-rows:  1fr 1fr;
         grid-template-columns: 1fr 1fr 1fr; */
      }

      .container {
        grid-template-rows: repeat(3, 1fr);
        grid-template-columns: repeat(3, 1fr);
      }
      .header {
        grid-column-start: 1;
        grid-column-end: 2;
      }
      /* .footer{
    
        grid-column-start:1;
        grid-column-end:4;
       } */
      .sidebar {
        grid-column-start: 3;
        grid-column-end: 4;
      }
      #button1:hover,
      #button2:hover {
        /* padding-top: 2rem; */
        cursor: pointer;
        color: rgb(35, 35, 35);
        background-color: rgb(145, 108, 67);
        transform: translateY(5px);

      }

      a:hover {
        /* text-decoration: underline; */
        background-color: bisque;
        color:rgb(49, 49, 49);
        border-radius: 12px;
        transition: all 0.3s ease;
        padding: 10px;
      }
      .content1 {
        /* opacity: 1; */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        grid-column-start: 1;
        grid-column-end: 3;
      }

      .item {
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        /* border: 2px solid rgb(255, 255, 255); */

        /* border: 2px solid rgb(255, 255, 255); */
      }
      /* .nav{
              grid-column-start:3;
        grid-column-end:4;
        } */
      #font {
        /* opacity: 1; */
        color: rgb(245, 245, 245);
        font-size: 4rem;
      }
      #para {
        font-size: 1.5rem;
      }
      #button1 {
      
        color: white;
        height: 4rem;
        width: 13rem;
        background-color: rgb(173, 127, 71);
        border: 2px solid rgb(173, 127, 71);
      }
      #button2 {
        background-color: transparent;
        color: rgb(109, 78, 30);
        height: 4rem;
        width: 11rem;
        border: 2px solid rgb(109, 78, 30);
      }
      /* menu{
            text-decoration: none;
        } */
      .navbar {
        text-decoration: none;
        /* border:2px solid red; */
        border: none;
        height: 4rem;
        width: 30rem;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: start;
 

      }
      a {
        font: bold;
        font-size: 1rem;
        color: rgb(255, 255, 255);
        text-decoration: none;
      }

      .footer{
  background:#5a3e2b;
  color:white;
  text-align:center;
  padding:40px 20px
}
.footer h3{
  margin-bottom:10px;
  font-size:24px
}
#home,#about-me,#filmography,#contact-me{
  /* transform:translateY(410px); */
   transition: all 1.0s ease;
}
.footer p{
  margin-bottom:6px;
  font-size:14px
}
    </style>
  </head>
  <body>
 


    <div class="container">
      <!-- <div class="item header">header</div> -->

      <div class="item sidebar navbar">
        <a href="index.html" id="home">HOME</a>
        <a href="about.html" id="about-me">ABOUT ME</a>
        <a href="filmography.html" id="filmography">FILMOGRAPHY</a>
        <a href="contact.html" id="contact-me">CONTACT ME</a>
      </div>


      <div class="item content1">
         <h1 id="font">
           TV, Film, and <br />
           Theater Actress
         </h1>
            <h3 id="para">Available for commissions worldwide.</h3>
         <div>
           <button id="button1">
            <b><a href="filmography.html">Video Gallery</a></b>
            </button>
            <button id="button2">
            <b><a href="contact.html">Contact Me </a></b>
            </button>
         </div>
      </div>

      <!-- <div class="item content2">content2</div> -->
      <!-- <div class="item content3">content3</div> -->
      <!-- <div style="color: white;" class="item footer">Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi at voluptate quae adipisci illum quisquam ea debitis placeat ipsa similique, reiciendis est?</div> -->
      <!-- <div class="item nav">nav</div> -->
      <!-- <i class="fi fi-brands-twitter"></i> -->
    </div>

    <footer class="footer">
  <h3>Filmography</h3>
  <p>Celebrating cinema and creative storytelling.</p>
  <p>2025 Filmography. All Rights Reserved.</p>
</footer>


  </body>

    let button1 = document.getElementById("button1");
  </script>
</html>
