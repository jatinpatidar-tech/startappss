<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark/Light Theme CSS</title>
<style>
  /* Default (Light theme) */
  :root {
    --bg-color: white;
    --text-color: black;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: sans-serif;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  h1 {
    margin-bottom: 20px;
  }

  /* Checkbox hack */
  #theme-toggle {
    display: none; /* hide actual checkbox */
  }

  label {
    cursor: pointer;
    padding: 10px 20px;
    background-color: gray;
    color: white;
    border-radius: 5px;
  }

  /* Dark theme when checkbox is checked */
  #theme-toggle:checked ~ body,
  body.dark-theme { /* optional for class toggle */
    --bg-color: #121212;
    --text-color: #f5f5f5;
  }
</style>
</head>
<body>
  <h1>Dark/Light Theme Demo</h1>

  <!-- Checkbox to toggle theme -->
  <input type="checkbox" id="theme-toggle">
  <label for="theme-toggle">Toggle Dark/Light</label>

  <!-- Optional content -->
  <p>This text changes color based on theme!</p>
</body>
</html>
