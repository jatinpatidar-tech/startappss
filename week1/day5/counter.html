<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: aquamarine;">
<button id="increment" style="color: green;">increment</button>
<button id="decrement" style="color: red;">decrement</button>
<h1 id="number">0</h1>
</body>
<script>
  ((count)=>{
        count=0; 
        console.log(count);
    }
  )();
     function counter (){
        let count=0;
      return {
        inc:function (){
           
    
            if(count>=10){

                alert("maximum limit reached");
                return count;
            }else{
                  count++;
                return count;
            }
        },
        dec:function (){
          
            if(count<=0){       
               
             alert("minimum limit reached");
             return count;
        }else{
             count--;
            return count;
        }
    }
      }
     }


     let button1=document.querySelector('button')
     let button2=document.getElementById('decrement')
     let numberbtn=document.getElementById('number')
     let counterfun=counter();
    button1.addEventListener('click',()=>{
        
        numberbtn.innerText=counterfun.inc();
    })
    button2.addEventListener('click',()=>{
         numberbtn.innerText=counterfun.dec();
    })

</script>
</html>
