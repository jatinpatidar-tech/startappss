<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learn css grid</title>
    <style>
       *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
         /* border: 2px solid black; */
       } 
       body {
         height: 100vh;
         width: 100vw;
         /* border: 2px solid rgb(4, 4, 4); */
       }
       .container{
           /* grid-row-start: ; */
           /* border: 2px solid rgb(44, 31, 141); */
           background-color: rgb(193, 239, 243);
           height: 100%;
           width: 100%;
           display: grid;
         padding: 2rem;
         row-gap: 1rem;
         column-gap: 1rem;
     /*  grid-template-rows:  100px 100px;
         grid-template-columns: 100px 100px 100px ; */
     /*  grid-template-rows:  1fr 1fr;
         grid-template-columns: 1fr 1fr 1fr; */
      
           grid-template-rows:  repeat(6,1fr);
         grid-template-columns:  repeat(1,1fr);

       }
       @media (min-width:760px) {
        .container{
                grid-template-rows:  repeat(4,1fr);
         grid-template-columns:  repeat(3,1fr);

        }
          .header{
       
        grid-column-start:1;
        grid-column-end:4;
       }
       .footer{
    
        grid-column-start:1;
        grid-column-end:4;
       }
       .sidebar{
    
        grid-row-start:3;
        grid-row-end:4;
       }
        .content1{
       /* grid-row-start: 2;
       grid-row-end: 4 ; */
        grid-column-start:2;
        grid-column-end:4;
       }
       }
       .item{
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid red;
        background-color: rgb(97, 167, 174);
        border: 2px solid rgb(0, 0, 0);
       }
     
       
    </style>
</head>
<body>
     <!-- <h1> jatin patidar</h1> -->
  <div class="container">
     <div class="item header">header</div>
     <div class="item sidebar">sidebar</div>
     <div class="item content1">content1</div>
     <div class="item content2">content2</div>
     <div class="item content3">content3</div>
     <div class="item footer">footer</div>
  </div>
</body>
</html>
