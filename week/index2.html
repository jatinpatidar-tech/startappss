        html {

        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Body */
body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #222;
  padding: 15px 30px;
}

.logo {
  color: white;
}

/* Menu */
.menu {
  list-style: none;
  display: flex;
  gap: 20px;
}

.menu a {
  color: white;
  text-decoration: none;
}

.menu a:hover {
  color: yellow;
}

/* Container */
.container {
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

/* Card */
.card {
  width: 300px;
  background-color: white;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid #ccc;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  text-align: center;
}

/* Text */
.card h2 {
  color: #333;
  margin-bottom: 10px;
}

.card p {
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 15px;
}

/* Button */
button {
  padding: 10px 20px;
  border: none;
  background-color: black;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: green;
}
